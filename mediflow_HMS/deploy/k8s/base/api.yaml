apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediflow-api
  labels:
    app: mediflow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mediflow-api
  template:
    metadata:
      labels:
        app: mediflow-api
    spec:
      containers:
        - name: api
          image: ghcr.io/pulok529/mediflow_hospital_management/api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: mediflow-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mediflow-api
spec:
  selector:
    app: mediflow-api
  ports:
    - port: 8080
      targetPort: 8080
