services:
  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api

  web:
    build:
      context: ./src/frontend/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SIGNALR_HUB_URL: /hubs/notifications
    environment:
      NODE_ENV: production
    expose:
      - "80"

  api:
    build:
      context: ./src/backend
      dockerfile: Mediflow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: Server=sqlserver;Database=MediflowDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: mediflow.api
      Jwt__Audience: mediflow.web
      Jwt__Secret: ${JWT_SECRET}
      Redis__ConnectionString: redis:6379
    expose:
      - "8080"
    depends_on:
      - sqlserver
      - redis

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql

  redis:
    image: redis:7-alpine

volumes:
  sql_data:
