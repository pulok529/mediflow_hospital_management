name: CD Example

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: pulok529/mediflow_hospital_management

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Mediflow.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: src/frontend/web
          file: src/frontend/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ github.ref_name }}

  deploy-k8s-example:
    runs-on: ubuntu-latest
    needs: publish-images
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Configure kube context
        run: echo "Configure kubectl context from secrets in real pipeline"
      - name: Deploy production overlay
        run: kubectl apply -k deploy/k8s/overlays/production
